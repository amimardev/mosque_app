[package]
name = "scanner-agent"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
uuid = { version = "1.13", features = ["v4", "fast-rng"] }
base64 = "0.22"
tempfile = "3.17"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
